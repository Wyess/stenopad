<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stenopad - JS Prototype</title>
    <style>
    * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body, html {
    height: 100%;
    overflow: hidden; /* 画面全体のスクロールは絶対に禁止 */
    font-family: sans-serif;
    background-color: #f5f5f5;
}

/* アプリ全体のコンテナ。JSで visualViewport の高さに100%同期 */
.app-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

/* 1. 上部：SVG表示エリア（絶対配置で上の領域を完全占有） */
.preview-area {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 100px;       /* 下から100px（入力欄の高さ分）のところまでをこのエリアにする */
    overflow-y: scroll;  /* ★強制的に独立した垂直スクロールバーを出す */
    background-color: #ffffff;
    padding: 15px;
    -webkit-overflow-scrolling: touch; /* スマホでのスクロールを滑らかに */
}

/* 画面の縦幅が狭いとき（スマホのキーボード表示時など）の領域調整 */
@media (max-height: 500px) {
    .preview-area {
        bottom: 60px;    /* キーボード表示時は入力欄が60pxに縮むので、底辺を60pxに広げる */
    }
}

#steno-svg-output {
    width: 100%;
    max-width: 800px;
    margin: 0 auto;
}

/* 2. 下部：入力エリア（画面最下部に完全にクランプして固定） */
.input-area {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 100px;       /* 通常時は高さ100pxに絶対固定 */
    background-color: #eaeaea;
    padding: 10px;
    border-top: 2px solid #ccc;
    z-index: 100;        /* 必ず一番手前に固定 */
}

@media (max-height: 500px) {
    .input-area {
        height: 60px;    /* キーボード表示時は極力薄く（60px）して固定 */
        padding: 5px;
    }
}

.input-area textarea {
    width: 100%;
    height: 100%;
    resize: none;
    padding: 8px;
    font-size: 16px;
    border: 1px solid #aaa;
    border-radius: 4px;
}
</style>
</head>
<body>

    <div class="app-container">
        <div class="preview-area">
            <div id="steno-svg-output">
                <p style="color: #999; text-align: center; margin-top: 40px;">ここに速記文字（SVG）が表示されます</p>
            </div>
        </div>

        <div class="input-area">
            <textarea id="steno-input" placeholder="ここに入力してください..."></textarea>
        </div>
    </div>

    <script type="module" src="./src/main.js"></script>
    <script src="https://unpkg.com/vconsole@latest/dist/vconsole.min.js"></script>
<script>
  // VConsole will be exported to `window.VConsole` by default.
  var vConsole = new window.VConsole();
</script>
</body>
</html>
